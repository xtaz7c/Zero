name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach Linux packages to
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FLATPAK_APP_ID: io.github.xtaz7c.zero

jobs:
  build-and-package:
    name: Build & package (Ubuntu x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Manual runs use the packaging workflow from main; the release tag is
          # only the destination for uploaded assets, not the source checkout.
          ref: ${{ github.event_name == 'release' && github.sha || 'main' }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 libxkbcommon-x11-dev libssl-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev file xvfb wget patchelf desktop-file-utils dpkg-dev flatpak flatpak-builder

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Validate binary
        run: |
          set -euo pipefail
          BIN="target/release/zero"
          test -f "$BIN"
          test -x "$BIN"
          file "$BIN"
          file "$BIN" | grep -qi 'ELF'
          test "$(stat -c%s "$BIN")" -gt 100000
          ldd "$BIN"

      - name: Runtime smoke test
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=2s 8s xvfb-run -a -s "-screen 0 1280x720x24" target/release/zero
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "Expected the GUI application to remain running for 8 seconds; exit status: $status"
            exit 1
          fi

      - name: Prepare common package files
        run: |
          set -euo pipefail
          mkdir -p dist/AppDir/usr/bin
          mkdir -p dist/AppDir/usr/share/applications
          mkdir -p dist/AppDir/usr/share/icons/hicolor/64x64/apps
          cp target/release/zero dist/AppDir/usr/bin/zero
          cp packaging/io.github.xtaz7c.zero.desktop dist/AppDir/usr/share/applications/
          cp assets/logo.png dist/AppDir/usr/share/icons/hicolor/64x64/apps/io.github.xtaz7c.zero.png

      - name: Build AppImage
        run: |
          set -euo pipefail
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage \
            --appdir dist/AppDir \
            --executable target/release/zero \
            --desktop-file packaging/io.github.xtaz7c.zero.desktop \
            --icon-file assets/logo.png \
            --output appimage
          APPIMAGE_FILE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE_FILE"
          mv "$APPIMAGE_FILE" dist/zero-linux-x86_64.AppImage
          chmod +x dist/zero-linux-x86_64.AppImage
          test -s dist/zero-linux-x86_64.AppImage

      - name: Build Debian package
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          ROOT="dist/deb-root"
          install -Dm755 target/release/zero "$ROOT/usr/bin/zero"
          install -Dm644 packaging/io.github.xtaz7c.zero.desktop "$ROOT/usr/share/applications/io.github.xtaz7c.zero.desktop"
          install -Dm644 assets/logo.png "$ROOT/usr/share/icons/hicolor/64x64/apps/io.github.xtaz7c.zero.png"
          install -d "$ROOT/DEBIAN"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: zero
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: xtaz7c
          Depends: libc6, libgcc-s1, libgtk-3-0, libgl1, libx11-6, libxcb1, libxkbcommon0, libwayland-client0
          Description: Lightweight Linux system assistant
           Zero displays system information and provides practical system
           maintenance suggestions in a native desktop interface.
          EOF
          dpkg-deb --root-owner-group --build "$ROOT" "dist/zero-linux-x86_64.deb"
          dpkg-deb --info dist/zero-linux-x86_64.deb

      - name: Prepare Flatpak source
        run: |
          set -euo pipefail
          mkdir -p dist/flatpak-source
          install -Dm755 target/release/zero dist/flatpak-source/zero
          install -Dm644 packaging/io.github.xtaz7c.zero.desktop dist/flatpak-source/io.github.xtaz7c.zero.desktop
          install -Dm644 assets/logo.png dist/flatpak-source/io.github.xtaz7c.zero.png
          install -Dm644 packaging/io.github.xtaz7c.zero.metainfo.xml dist/flatpak-source/io.github.xtaz7c.zero.metainfo.xml
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --repo=dist/flatpak-repo dist/flatpak-build packaging/flatpak.yml
          flatpak build-bundle dist/flatpak-repo dist/zero-linux-x86_64.flatpak io.github.xtaz7c.zero
          test -s dist/zero-linux-x86_64.flatpak

      - name: Prepare portable binary and checksums
        run: |
          set -euo pipefail
          cp target/release/zero dist/zero-linux-x86_64
          chmod +x dist/zero-linux-x86_64
          cd dist
          sha256sum zero-linux-x86_64 zero-linux-x86_64.AppImage zero-linux-x86_64.deb zero-linux-x86_64.flatpak > SHA256SUMS
          ls -lh zero-linux-x86_64*

      - name: Upload Linux packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-linux-packages-x86_64
          path: |
            app/dist/zero-linux-x86_64
            app/dist/zero-linux-x86_64.AppImage
            app/dist/zero-linux-x86_64.deb
            app/dist/zero-linux-x86_64.flatpak
            app/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Attach Linux packages to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: |
            app/dist/zero-linux-x86_64
            app/dist/zero-linux-x86_64.AppImage
            app/dist/zero-linux-x86_64.deb
            app/dist/zero-linux-x86_64.flatpak
            app/dist/SHA256SUMS
          fail_on_unmatched_files: true
