name: Linux
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  build-and-validate:
    name: Build & validate (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev file xvfb
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release
      - name: Validate binary
        run: |
          set -euo pipefail
          BIN="target/release/zero"
          test -f "$BIN"
          test -x "$BIN"
          file "$BIN"
          file "$BIN" | grep -qiE 'ELF|executable'
          SIZE=$(stat -c%s "$BIN")
          test "$SIZE" -gt 100000
          ldd "$BIN" | head -30 || true
      - name: Runtime smoke test
        run: |
          set -euo pipefail
          BIN="target/release/zero"
          OUT="${RUNNER_TEMP:-/tmp}/zero-smoke.png"
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 30s "$BIN" --screenshot "$OUT"
          test -f "$OUT"
          test "$(stat -c%s "$OUT")" -gt 1000
          file "$OUT"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-linux-x86_64
          path: app/target/release/zero
          if-no-files-found: error
          retention-days: 14
