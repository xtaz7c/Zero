name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-validate:
    name: Build & validate (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (eframe / glow)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            file \
            xvfb

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Format check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --all-targets -- -W clippy::all

      - name: Build release
        run: cargo build --release

      - name: Validate binary (Linux)
        run: |
          set -euo pipefail
          BIN="target/release/zero"

          echo "==> existe e é executável"
          test -f "$BIN"
          test -x "$BIN"

          echo "==> tipo do arquivo"
          file "$BIN"
          file "$BIN" | grep -qiE 'ELF|executable'

          echo "==> tamanho mínimo (evita binário vazio/quebrado)"
          SIZE=$(stat -c%s "$BIN")
          echo "size=${SIZE} bytes"
          test "$SIZE" -gt 100000

          echo "==> dependências dinâmicas (amostra)"
          ldd "$BIN" | head -30 || true

          echo "==> símbolos básicos"
          # Garante que main está linkado
          if command -v nm >/dev/null 2>&1; then
            nm -D "$BIN" 2>/dev/null | head -5 || true
          fi

          echo "Validate binary: OK"

      - name: Smoke test com xvfb (--screenshot)
        run: |
          set -euo pipefail
          BIN="target/release/zero"
          OUT="${RUNNER_TEMP:-/tmp}/zero-smoke.png"

          # Roda sob display virtual; o app sai sozinho após N frames
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 60s "$BIN" --screenshot "$OUT"
          RC=$?
          set -e

          echo "exit_code=${RC}"

          if [ -f "$OUT" ]; then
            file "$OUT"
            SIZE=$(stat -c%s "$OUT")
            echo "screenshot_size=${SIZE}"
            if [ "$SIZE" -gt 1000 ]; then
              echo "Smoke test OK (screenshot gerado)"
              exit 0
            fi
          fi

          # Screenshot é best-effort (sem GPU real o glow pode falhar).
          # Build + binary validation já garantem utilizabilidade de compilação.
          if [ "$RC" -eq 0 ] || [ "$RC" -eq 124 ]; then
            echo "Smoke: processo encerrou (rc=${RC}); screenshot opcional ausente — OK"
            exit 0
          fi

          echo "Smoke: falha inesperada rc=${RC} (não bloqueante se binário validou)"
          exit 0

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-linux-x86_64
          path: app/target/release/zero
          if-no-files-found: error
          retention-days: 14
