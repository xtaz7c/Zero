name: Linux
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach the Linux binary to
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-validate:
    name: Build & validate (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 libxkbcommon-x11-dev libssl-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev file imagemagick xvfb

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Format sources
        run: cargo fmt --all

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Validate binary
        run: |
          set -euo pipefail
          BIN="target/release/zero"
          test -f "$BIN"
          test -x "$BIN"
          file "$BIN"
          file "$BIN" | grep -qiE 'ELF|executable'
          SIZE=$(stat -c%s "$BIN")
          test "$SIZE" -gt 100000
          ldd "$BIN" | head -30 || true

      - name: Runtime smoke test
        run: |
          set -euo pipefail
          BIN="target/release/zero"
          OUT="${RUNNER_TEMP:-/tmp}/zero-smoke.png"
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            "$1" &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            sleep 3
            import -window root "$2"
            test -f "$2"
            test "$(stat -c%s "$2")" -gt 1000
            file "$2"
          ' _ "$BIN" "$OUT"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-linux-x86_64
          path: app/target/release/zero
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release asset
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: cp target/release/zero target/release/zero-linux-x86_64

      - name: Attach Linux binary to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: app/target/release/zero-linux-x86_64
          fail_on_unmatched_files: true
