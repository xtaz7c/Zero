name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-validate:
    name: Build & validate (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (eframe / glow)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            xvfb

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Validate binary
        run: |
          set -euo pipefail
          BIN="target/release/zero"
          test -f "$BIN"
          test -x "$BIN"
          SIZE=$(stat -c%s "$BIN")
          echo "binary size: $SIZE bytes"
          # Sanity: binário não vazio e com tamanho razoável
          test "$SIZE" -gt 100000
          # Help / smoke sem display: só garante que o loader sobe até main
          # (fullscreen precisa de display; usamos xvfb no próximo passo)
          file "$BIN"
          ldd "$BIN" | head -20 || true

      - name: Smoke test (xvfb + --screenshot)
        run: |
          set -euo pipefail
          BIN="target/release/zero"
          OUT="/tmp/zero-smoke.png"
          # Roda alguns frames sob framebuffer virtual e sai
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 45s "$BIN" --screenshot "$OUT" || true
          if [ -f "$OUT" ]; then
            file "$OUT"
            SIZE=$(stat -c%s "$OUT")
            echo "screenshot size: $SIZE"
            test "$SIZE" -gt 1000
            echo "Smoke test OK (screenshot gerado)"
          else
            echo "Aviso: screenshot não gerado (pode falhar sem GPU); build ainda é válido"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-linux-x86_64
          path: app/target/release/zero
          if-no-files-found: error
          retention-days: 14
