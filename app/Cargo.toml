[package]
name = "zero"
version = "1.0.0"
edition = "2021"
publish = false
description = "Assistente de sistema Linux leve — hardware, software, otimizações e auto-update"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
