[package]
name = "zero"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
eframe = { version = "0.37.0", features = ["glow"] }
egui = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
ureq = { version = "2", features = ["json"] }
winit = "0.30"

[profile.release]
lto = true
